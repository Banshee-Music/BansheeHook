[profile.default]

src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]

solc_version = "0.8.26"

optimizer = true
optimizer_runs = 200

via_ir = true

evm_version = "cancun"

ffi = true

fs_permissions = [
    { access = "read-write", path = "./" }
]

remappings = [
    "forge-std/=lib/forge-std/src/",
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "v4-periphery/=lib/v4-periphery/",
    "v4-core/=lib/v4-periphery/lib/v4-core/"
]